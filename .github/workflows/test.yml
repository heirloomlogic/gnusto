name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  test-linux:
    # ARM runners are free for public repos and faster than the x86 ones, and
    # the swift-syntax prebuilt below is published for aarch64 as well.
    runs-on: ubuntu-24.04-arm

    # The toolchain arrives as an image rather than an install step. Two reasons
    # beyond the ~30s saved: the image is version-pinned (macro plugins are
    # compiler-coupled, so a floating toolchain is a real hazard), and SwiftPM
    # keys its swift-syntax prebuilt off the exact compiler version, so the
    # toolchain has to be something a prebuilt exists for.
    #
    # THE PIN TRAILS LATEST STABLE ON PURPOSE. From Swift 6.2 SwiftPM downloads
    # a prebuilt `MacroSupport` static library instead of compiling swift-syntax
    # (~700 files, and this workflow used to build it once per configuration).
    # It is on by default; nothing in Package.swift asks for it. But the Linux
    # prebuilts are published per exact toolchain, and as of August 2026 the
    # newest Linux toolchain with one is 6.3.2 — 6.3.3 has none, though the
    # macOS 6.3.3 prebuilt exists. Bumping this to "latest" silently costs
    # several minutes a run. Before bumping, check that a prebuilt exists:
    #
    #   curl -sfI https://download.swift.org/prebuilts/swift-syntax/603.0.2/swift-6.3.3-RELEASE-ubuntu_noble_aarch64.json
    #
    # (substituting the swift-syntax version this package resolves to, and the
    # toolchain you want). A 200 means the bump is free; a 404 means it isn't.
    # The "Confirm swift-syntax prebuilt" step below reports what actually
    # happened, so a wrong guess here shows up as a warning rather than a
    # mystery slowdown.
    container: swift:6.3.2-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The container runs as root over a checkout git considers foreign;
      # without this, git refuses ("dubious ownership") wherever SwiftPM or a
      # build step shells out to it.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Only SwiftPM's shared cache — the downloaded prebuilt and the dependency
      # checkouts, both content-addressed and cheap to restore. Deliberately not
      # `.build`: that holds compiled objects for two configurations under a
      # build system whose layout is still moving, and a stale hit there is a
      # debugging session, not a saved minute.
      - name: Cache SwiftPM downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /root/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve dependencies
        run: |
          swift --version
          swift package resolve

      # Package.resolved is not tracked (see .gitignore), so swift-syntax floats
      # within the range Package.swift declares. The day it tags a version with
      # no published prebuilt, the range moves past the prebuilt and this job
      # quietly goes back to compiling swift-syntax from source. Warn rather
      # than fail: a swift-syntax release should not red-X the repo, but it
      # should say so out loud.
      - name: Confirm swift-syntax prebuilt
        run: |
          if [ -d .build/prebuilts/swift-syntax ]; then
            echo "Using prebuilt swift-syntax: $(ls .build/prebuilts/swift-syntax)"
          else
            echo "::warning::No swift-syntax prebuilt for this toolchain — swift-syntax will build from source (several minutes). See the pin comment in .github/workflows/test.yml."
          fi

      # The test target `@testable import`s the CloakOfDarkness and Zork1
      # executable targets. The legacy `native` build system refuses that
      # ("main module of an executable, cannot be imported"); the newer Swift
      # Build system (`--build-system swiftbuild`) supports it. On macOS that
      # combo fails at link time (Xcode 26.x eagerly links SwiftUICore, fixed
      # in 6.4); Linux has no SwiftUICore, so a stable toolchain links cleanly.
      - name: Test (Debug)
        run: swift test --build-system swiftbuild

      # Release run guards against optimization-only regressions (e.g. generic
      # `#Predicate` miscompiles) that the Debug suite passes through silently.
      # It is the most expensive step by a wide margin, so it runs on pushes to
      # main rather than on every PR: such a regression surfaces at merge, not
      # before it. Widen this back to PRs if one ever slips through.
      - name: Test (Release)
        if: github.event_name == 'push'
        run: swift test -c release --build-system swiftbuild

      # The starter template is a standalone package with a path dependency on
      # this repo; building it here keeps the template from rotting.
      - name: Template (Debug)
        run: swift test --package-path Templates/NewGame --build-system swiftbuild
