name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

# A PR groups by ref, so a force-push supersedes its own run. Everything else gets a
# unique group via run_id, deliberately: GitHub cancels a *pending* run as soon as a
# third enters the group, whatever cancel-in-progress says. Sharing one group across
# pushes to main would therefore drop the Release-configuration test below on exactly
# the bursty merges — measured at 2 of the last 40 pushes — and main has no branch
# protection, so that run is the only gate there is.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Generated launchers use the reviewed companion without adding it to Gnusto's manifest.
env:
  GNUSTO_TERMINAL_PATH: ${{ github.workspace }}/.context/companions/GnustoTerminal
  GNUSTO_SWIFT_BUILD_FLAGS: '["--build-system","swiftbuild","--disable-experimental-prebuilts"]'

jobs:
  test-linux:
    # ARM runners are free for public repos and measurably faster here: the
    # Debug suite builds and runs in ~2m against ~3m40s on the x86 runner.
    runs-on: ubuntu-24.04-arm

    # Roughly twice the worst observed run (16m23s, the push-to-main leg that adds the
    # Release suite). Generous on purpose: this bounds a hang, and the default is six
    # hours. A false timeout costs a red build; the minutes it saves are free anyway.
    timeout-minutes: 35

    # The toolchain arrives as an image rather than a scripted install. Beyond
    # the ~30s saved, the compiler is pinned, which matters because macro
    # plugins are compiler-coupled and a floating toolchain is a real hazard.
    container: swift:6.3.3-noble

    # This package cannot use SwiftPM's prebuilt swift-syntax yet, and that is
    # worth writing down because the idea is so obviously attractive.
    #
    # Since 6.2 SwiftPM downloads a prebuilt `MacroSupport` static library
    # instead of compiling swift-syntax (~700 files, built once per
    # configuration). It is on by default and needs nothing from Package.swift.
    # It does work here: on 6.3.2 the aarch64 prebuilt downloads in 0.26s and
    # swift-syntax never compiles. The build then fails to link, on both x86_64
    # and aarch64:
    #
    #   GnustoMacrosTests-test-runner: clang: error: no such file or directory:
    #     '.build/out/Products/Debug-linux/GnustoMacrosTests.so'
    #
    # That is swiftlang/swift-package-manager#10218 — when the Swift Build
    # system builds a testable variant of a macro target whose swift-syntax
    # products came from a prebuilt, the prebuilt never reaches the test
    # product's link inputs. A SwiftPM maintainer has a fix landing in 6.5.
    #
    # Deleting GnustoMacrosTests does not dodge it; that was measured, not
    # assumed. Without it the build links and then dies at runtime instead:
    #
    #   GnustoTests.so: undefined symbol: $s11SwiftSyntax011LabeledExprB0VN
    #
    # because GnustoTests depends on Gnusto, which depends on the macro. Every
    # test target here reaches swift-syntax that way, so there is no subset of
    # the suite that can use the prebuilt today.
    #
    # So prebuilts are disabled explicitly rather than left to chance: no Linux
    # prebuilt is published for 6.3.3 today, but if one appears, the default
    # would flip this job from working to failing on that link error, with
    # nothing in the diff to explain it.
    #
    # WHEN 6.5 SHIPS: drop the --disable-experimental-prebuilts flags below and
    # confirm the log shows "Downloading package prebuilt" with no swift-syntax
    # compilation. That is worth several minutes a run.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and every step after this one runs SwiftPM, which
          # executes third-party build-tool plugin code. Left at the default, the
          # token sits in .git/config for all of it.
          persist-credentials: false
          # NewGameTests runs bin/new-game with no --dep-path, which pins the
          # generated package to this repository's newest release tag. The
          # default checkout is shallow and fetches no tags at all, so that
          # generation refuses (#384). Tags are small; this is not the `.build`
          # cache tradeoff the comment two steps down is guarding against.
          fetch-tags: true

      # Coordinated companion revision; publication waits its independent review.
      - name: Checkout GnustoTerminal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HeirloomLogic/GnustoTerminal
          ref: 95c5a7abd42771b09a6103c9e89988c9b55b703d
          path: .context/companions/GnustoTerminal
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The container runs as root over a checkout git considers foreign.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # SwiftPM's shared cache only — the dependency checkouts, content-addressed
      # and cheap to restore. Deliberately not `.build`: that holds compiled
      # objects for two configurations under a build system whose layout is
      # still moving, and a stale hit there is a debugging session, not a saved
      # minute.
      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve dependencies
        run: |
          swift --version
          swift package resolve --disable-experimental-prebuilts

      # Keep the established Linux backend and prebuilt policy while the demo
      # corpus changes from executable targets to importable game libraries.
      - name: Test (Debug)
        run: swift test --build-system swiftbuild --disable-experimental-prebuilts

      # The warning must survive importing Gnusto from an author module.
      - name: Entity interpolation diagnostics
        run: bin/tests/entity-interpolation.sh "$(swift build --build-system swiftbuild --show-bin-path)"

      # The generated deployment package disables Playtest throughout the graph
      # and uses its own scratch directory. Consume the builder's returned path:
      # the private launcher product is not the catalog game library product.
      - name: Build without the Playtest trait
        run: |
          set -eu
          bin/build-game CloakOfDarkness --mode deployment --json > "$RUNNER_TEMP/deployment.json"
          binary="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).binary)' "$RUNNER_TEMP/deployment.json")"
          if GNUSTO_MCP=1 "$binary" </dev/null >"$RUNNER_TEMP/refusal.txt" 2>&1; then
            echo "error: a Playtest-less binary answered GNUSTO_MCP instead of refusing" >&2
            cat "$RUNNER_TEMP/refusal.txt" >&2
            exit 1
          fi
          grep -q "built without it" "$RUNNER_TEMP/refusal.txt"

      # Release run guards against optimization-only regressions (e.g. generic
      # `#Predicate` miscompiles) that the Debug suite passes through silently.
      # It is the most expensive step by a wide margin, so it runs on pushes to
      # main rather than on every PR: such a regression surfaces at merge, not
      # before it. Widen this back to PRs if one ever slips through.
      - name: Test (Release)
        if: github.event_name == 'push'
        run: swift test -c release --build-system swiftbuild --disable-experimental-prebuilts

      # The template is a standalone package with a path dependency on this repo;
      # building it here keeps it from rotting. It is also the generator's input,
      # so a green run here is the precondition for the generated-package step
      # below it.
      - name: Template (Debug)
        run: swift test --package-path bin/templates --build-system swiftbuild --disable-experimental-prebuilts

      # The step above proves the generator's *input* builds. This one proves its
      # output does — which is what an author actually receives, shims and all.
      # --dep-path points the generated package at this working tree rather than
      # at the last published tag, so a change to the engine is tested by the
      # thing that will ship with it.
      - name: Generated package (Debug)
        run: |
          bin/new-game Scratch "$RUNNER_TEMP/Scratch" --dep-path "$PWD"
          swift test --package-path "$RUNNER_TEMP/Scratch" --build-system swiftbuild --disable-experimental-prebuilts
          cd "$RUNNER_TEMP/Scratch" && bin/export-game | grep -qx Scratch
          # A shim that dispatches correctly still isn't proof the dispatched tool
          # ran against THIS package: bin/playtest-replay derives --package-path
          # from its own $PWD, and a whole-branch review found that read happening
          # after this script's own `cd` to Gnusto's checkout, so it silently built
          # Gnusto instead of the generated package. Checking that the printed
          # binary lies under $RUNNER_TEMP/Scratch is what actually discriminates
          # that — an exit-code check alone passes whichever package got built.
          #
          # Both sides go through `realpath`, because the two paths can name one
          # directory in different words: `swift build --show-bin-path` answers
          # with the physical path, while $RUNNER_TEMP is whatever the runner
          # set. On macOS that is under /var/folders, which resolves to
          # /private/var/folders, so comparing the two as text fails while they
          # name the same package — a false failure that reads exactly like a
          # real regression in the generator.
          built="$(bin/playtest-replay Scratch --build)"
          built_real="$(realpath "$built")"
          want_real="$(realpath "$RUNNER_TEMP/Scratch")"
          case "$built_real" in
            "$want_real"/*) ;;
            *)
              echo "bin/playtest-replay --build built the wrong package: $built" >&2
              exit 1
              ;;
          esac

          # And that the generated manifest's trait actually reaches the engine.
          # `--disable-default-traits` acts on the *root* package, while a
          # dependency's default traits are enabled whatever the root does — so
          # the template forwards its own `Playtest` trait to Gnusto's, and a
          # forwarding line that was dropped or misspelled would still ship the
          # server with CI green. The only check that can tell is a binary:
          # build the generated game with no traits and make it refuse MCP.
          bin/build-game Scratch --mode deployment --json > "$RUNNER_TEMP/scratch-deployment.json"
          binary="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).binary)' "$RUNNER_TEMP/scratch-deployment.json")"
          if GNUSTO_MCP=1 "$binary" </dev/null >"$RUNNER_TEMP/scratch-refusal.txt" 2>&1; then
            echo "error: the generated package does not forward the Playtest trait" >&2
            cat "$RUNNER_TEMP/scratch-refusal.txt" >&2
            exit 1
          fi
          grep -q "built without it" "$RUNNER_TEMP/scratch-refusal.txt"

      # Build on Linux, then run the archives in a separate base-OS container.
      - name: Prepare Linux recipient acceptance
        run: node bin/tests/linux-recipient.mjs "$RUNNER_TEMP/linux-recipient"

      - name: Upload Linux recipient fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-recipient
          path: ${{ runner.temp }}/linux-recipient
          if-no-files-found: error
          retention-days: 1

  package-graphs:
    runs-on: ubuntu-24.04-arm
    container: swift:6.3.3-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout GnustoTerminal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HeirloomLogic/GnustoTerminal
          ref: 95c5a7abd42771b09a6103c9e89988c9b55b703d
          path: .context/companions/GnustoTerminal
          persist-credentials: false
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Qualify actual path and URL author graphs
        env:
          GNUSTO_REAL_GRAPH: '1'
          GNUSTO_PUBLIC_TERMINAL_GRAPH: '1'
          GNUSTO_TERMINAL_PATH: '' # Public graph fixtures must not inherit the local override.
          GNUSTO_GRAPH_EVIDENCE: ${{ runner.temp }}/package-graphs.json
        run: node --test bin/tests/game-build.test.mjs
      - name: Qualify local dependency invalidation and rejected deployment traits
        run: node bin/tests/game-final-fixes.integration.mjs
      - name: Qualify MCP isolation and relocated resources on Linux
        run: node bin/tests/game-deployment.integration.mjs

  linux-recipient:
    needs: test-linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      # No checkout: the recipient receives distributions and evidence only.
      - name: Download Linux recipient fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-recipient
          path: recipient
      # The two static distributions occupy ~150 MiB together before session output.
      # Bound writable scratch at 256 MiB so both can remain extracted until cleanup.
      - name: Play without a development toolchain
        run: |
          docker run --rm --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m \
            --mount "type=bind,source=$PWD/recipient,target=/recipient,readonly" \
            ubuntu:24.04 /bin/bash /recipient/check.sh

  # A generated package's round is dispatchable, proved by dispatching everything
  # short of the agents.
  #
  # `bin/playtest-preflight` is the front door and the only check that can say this:
  # in one command it exercises the shim, `gnusto_find_repo`, the build, a live MCP
  # handshake over a pipe of its own, `open`/`survey`/`finish`/`replay`, the
  # `closing.json` field check, `.mcp.json` against `.claude/settings.json`, and the
  # layout derivation. Nothing else in this file reaches past the first of those.
  #
  # Its own job rather than a step in `test-linux`, and the tradeoff is worth stating
  # plainly rather than justified by harness.yml's argument, which does not quite
  # apply: that job is containerless because the suite's image ships no Node, and this
  # one adds Node to that same image anyway. The real trade is that `test-linux`
  # already generates and builds `Scratch`, so this pays for that build a second time
  # on a runner where `.build` is deliberately not cached. Measured on the first run:
  # 1m53s for the whole job, 67s of it the build and the MCP handshake together —
  # cheap because `Scratch` is one file over a cached dependency graph, and a third of
  # `test-linux`'s 6m41s, so the two in parallel leave the wall clock unchanged. What
  # it buys is a separately named preflight failure rather than one arriving
  # at the end of the full suite.
  generated-round:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container: swift:6.3.3-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Coordinated companion revision; publication waits its independent review.
      - name: Checkout GnustoTerminal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HeirloomLogic/GnustoTerminal
          ref: 95c5a7abd42771b09a6103c9e89988c9b55b703d
          path: .context/companions/GnustoTerminal
          persist-credentials: false

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Generated builds and preflight require Node; the Swift container has none.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      # Preflight builds its generated development launcher; resolving the game here
      # keeps a network failure from reading as a failed handshake.
      - name: Generate the package
        run: |
          bin/new-game Scratch "$RUNNER_TEMP/Scratch" --dep-path "$PWD"
          swift package --package-path "$RUNNER_TEMP/Scratch" resolve --disable-experimental-prebuilts

      - name: Preflight the generated package
        run: node bin/tests/preflight-headless.mjs "$RUNNER_TEMP/Scratch" Scratch

      # An exit code alone passes whichever package got described — the same hole the
      # realpath check in `Generated package (Debug)` exists to close. What
      # discriminates here is that the package-relative answers name the GAME and the
      # three harness-relative ones point into the engine checkout, which is a
      # distinction this repository's own preflight run cannot make: here the two
      # roots are the same directory and every derivation returns the literal it
      # replaced.
      - name: The layout was derived, not assumed
        working-directory: ${{ runner.temp }}/Scratch
        run: |
          # JavaScript template interpolation belongs to Node, not this shell.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs")
            const path = require("node:path")
            const a = JSON.parse(fs.readFileSync(".context/playtest-round-args.json", "utf8"))
            const engine = fs.realpathSync(process.env.GITHUB_WORKSPACE)
            const fail = []
            const eq = (key, want) => {
              if (a[key] !== want) fail.push(`${key} is ${JSON.stringify(a[key])}, want ${JSON.stringify(want)}`)
            }
            eq("game", "Scratch")
            eq("projectName", "Scratch")
            eq("gameSourceDir", "Sources/Scratch")
            eq("gameDocsDir", "docs/games")
            eq("mcpServer", "scratch")
            // No CLAUDE.md and no `gh` in this container: both degrade rather than
            // guess, and a round that guessed either would cite a file nobody has or
            // try to file an issue against nothing.
            eq("conventionsPath", "")
            eq("tracker", false)
            // The three that belong to the HARNESS: they resolve into the engine
            // checkout, which is the assertion the engine repo cannot make about
            // itself — there the two roots are one directory and every one of these
            // is a relative path that happens to be right.
            //
            // Deliberately NOT asserting that they fall outside the package. With a
            // git dependency, which is the ordinary case, SwiftPM resolves the engine
            // to <pkg>/.build/checkouts/Gnusto — so "outside the package" is true only
            // of the --dep-path layout this job happens to generate with, and encoding
            // it would make the ordinary topology read as a generator regression.
            for (const key of ["enginePath", "refPath", "workflowPath"]) {
              const value = String(a[key] || "")
              if (!value.startsWith(engine + path.sep)) fail.push(`${key} is not in the engine checkout: ${value}`)
              if (!fs.existsSync(value)) fail.push(`${key} does not exist: ${value}`)
            }
            if (fail.length) { console.error(fail.join("\n")); process.exit(1) }
            console.log("layout derived:", JSON.stringify(a, null, 2))
          '

      - name: The routes tool answers in a package that has none
        working-directory: ${{ runner.temp }}/Scratch
        run: bin/playtest-routes Scratch list
