# TEMPORARY. Delete before merge.
#
# Round 1 settled the first question:
#   A: x86_64, prebuilt ON  -> FAILED (same missing GnustoMacrosTests.so)
#   B: ARM,    prebuilt OFF -> passed, 2m14s
# So the prebuilt is implicated and the architecture is not.
#
# Round 2 asks whether the host-only macro TEST target is the trigger. If the
# build succeeds with GnustoMacrosTests removed from the manifest, then the
# prebuilt is usable for everything except that one target, and relocating it
# would recover the win. If it still fails, prebuilts and swiftbuild are simply
# incompatible for this package.

name: Scratch probe

on:
  push:
    branches:
      - "heirloomlogic/prebuilt-swift-syntax-ci"

jobs:
  c-arm-prebuilt-on-no-macro-tests:
    runs-on: ubuntu-24.04-arm
    container: swift:6.3.2-noble
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # awk, not python3 — the Swift image has no python3 (round 2 attempt 1
      # died on exit 127 here, which was this script's bug, not the package's).
      - name: Drop the macro test target from the manifest
        run: |
          set -eu
          awk '
          /^[[:space:]]*\.testTarget\($/ { held = $0; have = 1; next }
          have && /name: "GnustoMacrosTests"/ { have = 0; skipping = 1; removed = 1; next }
          have { print held; have = 0 }
          skipping { if ($0 ~ /^[[:space:]]*\),$/) skipping = 0; next }
          { print }
          END { if (!removed) { print "ERROR: GnustoMacrosTests not found" > "/dev/stderr"; exit 1 } }
          ' Package.swift > Package.swift.new
          mv Package.swift.new Package.swift
          rm -rf Tests/GnustoMacrosTests
          echo "removed GnustoMacrosTests; testTarget count now $(grep -c testTarget Package.swift)"

      - name: Resolve
        run: |
          swift --version
          swift package resolve
          ls .build/prebuilts/swift-syntax 2>/dev/null || echo "NO PREBUILT"

      - name: Test (Debug)
        run: swift test --build-system swiftbuild
