name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# See test.yml for why pushes get a singleton group rather than sharing one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  swift-format-lint:
    # Pinned, not native. swift-format ships with the toolchain, so the variable that
    # decides what "formatted" means is the Swift version, never the platform — a
    # macOS/Linux disagreement would be a swift-format bug. This job used to run on
    # macos-26 to match the Xcode binary CLAUDE.md tells authors to run, but that is
    # the *less* pinned of the two: macos-26 is a rolling image, so a GitHub Xcode
    # roll could shift the formatting underneath the repo and turn an unrelated PR
    # red with nothing in the diff to explain it. The container below is the same
    # image test.yml pins, so the lint and the suite now agree on one toolchain.
    #
    # The residual gap is a developer on a newer Xcode than 6.3.3. Persnicket's CI
    # notes warn that the .swift-format schema can drift across a Swift minor, so if
    # a local run and this job ever disagree, compare the two `swift-format --version`
    # lines first. That comparison is only possible on this side: the container
    # answers `6.3.3` and the Xcode-bundled binary answers `main`.
    runs-on: ubuntu-24.04-arm
    container: swift:6.3.3-noble

    # ~45s observed, image pull included; floored well above that because a timeout
    # is here to catch a hang.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and `swift package resolve` below runs plugin code.
          persist-credentials: false

      # The container runs as root over a checkout git considers foreign; without
      # this, git refuses ("dubious ownership") wherever SwiftPM shells out to it.
      # See test.yml, which needs it for the same reason.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup swift-format lint
        run: |
          touch .dev-tooling
          swift package resolve
          .build/checkouts/Persnicket/bin/ci-lint-setup
          swift-format --version

      - name: Lint (strict)
        run: swift-format lint --strict --parallel --recursive --configuration .swift-format Sources Tests
