name: Release

# Build the package's executable products for macOS and Linux and attach them to
# the GitHub release for a version tag. This is the CI counterpart to the local
# `bin/export-game`: it discovers products the same way (`swift package describe`),
# so it needs no edits when products come and go.
#
# Downstream authors: a ready-to-copy version of this lives at
# `Templates/NewGame/.github/workflows/release.yml` — drop the NewGame folder at
# your repo root and tagging a version publishes your game with no changes.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

# Read by default; only the `release` job below is granted write, because only it
# publishes. The two build jobs need nothing — artifact upload authenticates with
# ACTIONS_RUNTIME_TOKEN, which is independent of GITHUB_TOKEN.
permissions:
  contents: read

# A deploy, so a superseded run is never cancelled. Distinct tags are distinct refs;
# grouping by ref only serialises a re-run of the same tag, which is what you want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Products to build but never publish. "Zork" is Activision's; the Zork1 target
# exists here only as an internal demo, so it is excluded from public release
# artifacts. Downstream copies leave this empty.
env:
  EXCLUDE_PRODUCTS: "Zork1"

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Builds only; `swift build` runs plugin code, so do not leave the token
          # lying in .git/config for it.
          persist-credentials: false

      # `swift build -c release --product <P>` is the same recipe bin/export-game
      # uses locally; on macOS 15+ the binary links the OS Swift runtime, so the
      # single file is the game. Ad-hoc sign it (matching the share step in the
      # docs) and tar it so the exec bit survives the download.
      - name: Build and package release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          arch="$(uname -m)"
          bindir="$(swift build -c release --show-bin-path)"
          for product in $(swift package describe | awk '$1=="Name:"{n=$2} $1=="Executable:"{print n}'); do
            case " $EXCLUDE_PRODUCTS " in *" $product "*) echo "Skipping $product (excluded)"; continue ;; esac
            echo "Building $product (release)…"
            swift build -c release --product "$product"
            codesign -s - "$bindir/$product"
            tar czf "dist/${product}-macos-${arch}.tar.gz" -C "$bindir" "$product"
          done
          ls -la dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist/*.tar.gz
          if-no-files-found: error
          # Artifacts outlive a run attempt, so without this "Re-run all jobs" on a
          # release dies on 409 Conflict before it builds anything.
          overwrite: true

  build-linux:
    # x86_64 on purpose. The test workflow runs on ARM, but the asset names here
    # come from `uname -m`, and the published Linux binaries have always been
    # x86_64 — moving this runner would silently change what people download.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Same toolchain image and version as the test workflow — keep the two in
    # step. Nothing here needs the prebuilt-swift-syntax caveat that workflow
    # documents: no test targets are built, so the macro test target that
    # trips swiftlang/swift-package-manager#10218 is never in the graph.
    container: swift:6.3.3-noble

    # A container job runs steps under `sh`, and on Ubuntu that is dash, which
    # rejects `set -o pipefail` outright — the build step below died in zero
    # seconds the first time. Ask for bash explicitly.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Builds only. `git config --global --add safe.directory` below needs no auth.
          persist-credentials: false

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and package release binaries
        run: |
          set -euo pipefail
          swift --version
          mkdir -p dist
          arch="$(uname -m)"
          bindir="$(swift build -c release --show-bin-path)"
          for product in $(swift package describe | awk '$1=="Name:"{n=$2} $1=="Executable:"{print n}'); do
            case " $EXCLUDE_PRODUCTS " in *" $product "*) echo "Skipping $product (excluded)"; continue ;; esac
            echo "Building $product (release)…"
            swift build -c release --product "$product"
            tar czf "dist/${product}-linux-${arch}.tar.gz" -C "$bindir" "$product"
          done
          ls -la dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          # See the macOS upload: without this a re-run cannot replace its artifacts.
          overwrite: true

  release:
    needs: [build-macos, build-linux]
    # workflow_dispatch runs still build both platforms as a smoke test; only a
    # real tag push publishes a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The only job that writes. Creating a release and uploading its assets need
    # exactly this and nothing more.
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job deliberately has no checkout — it only moves artifacts. But `gh`
          # finds its repo from --repo, then GH_REPO, then a git remote, and never
          # from GITHUB_REPOSITORY. Without this line every command below dies with
          # "fatal: not a git repository" after the assets have already been built,
          # which is how tags 0.1.0 through 0.3.0 all published zero binaries.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          assets=(artifacts/**/*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "error: no release assets were produced" >&2
            exit 1
          fi
          echo "Assets: ${assets[*]}"

          cat > release-notes.md <<'EOF'
          These binaries exist to exercise Gnusto's release workflow. They are
          example games from the package's demo products, not featured products.

          Each asset is a `.tar.gz` holding a single executable for the named
          platform. On macOS 15+ the binary links the Swift runtime that ships
          with the OS, so it runs directly — no Xcode, no toolchain.

          macOS binaries are ad-hoc signed; a downloaded copy is quarantined by
          Gatekeeper until you clear it:

              xattr -dr com.apple.quarantine ./<Game>

          Notarization is not performed.
          EOF

          # A version suffix (e.g. 1.2.0-beta) marks a pre-release.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${prerelease[@]}"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
