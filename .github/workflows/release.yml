name: Release

# Build the package's executable products for macOS and Linux and attach them to
# the GitHub release for a version tag. This is the CI counterpart to the local
# `bin/export-game`: it discovers products the same way (`swift package describe`),
# so it needs no edits when products come and go.
#
# Downstream authors: a copy of this lives at
# `bin/templates/.github/workflows/release.yml` — bin/new-game copies it into
# your repo root and tagging a version publishes your game with no changes.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

# Read by default; only the `release` job below is granted write, because only it
# publishes. The two build jobs need nothing — artifact upload authenticates with
# ACTIONS_RUNTIME_TOKEN, which is independent of GITHUB_TOKEN.
permissions:
  contents: read

# A deploy, so a superseded run is never cancelled. Distinct tags are distinct refs;
# grouping by ref only serialises a re-run of the same tag, which is what you want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Products to build but never publish. "Zork" is Activision's; the Zork1 target
# exists here only as an internal demo, so it is excluded from public release
# artifacts. Downstream copies leave this empty.
env:
  EXCLUDE_PRODUCTS: "Zork1"

jobs:
  build-macos:
    runs-on: macos-26
    # Notarization is a round trip to Apple that usually takes a few minutes and
    # occasionally much longer.
    timeout-minutes: 60
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Builds only; `swift build` runs plugin code, so do not leave the token
          # lying in .git/config for it.
          persist-credentials: false

      # `swift build -c release --disable-default-traits --product <P>` is the
      # same recipe bin/export-game uses locally; on macOS 15+ the binary links
      # the OS Swift runtime, so the single file is the game.
      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p stage
          # Ships without the `Playtest` trait, exactly as bin/export-game does.
          bindir="$(swift build -c release --disable-default-traits --show-bin-path)"
          for product in $(swift package describe | awk '$1=="Name:"{n=$2} $1=="Executable:"{print n}'); do
            case " $EXCLUDE_PRODUCTS " in *" $product "*) echo "Skipping $product (excluded)"; continue ;; esac
            echo "Building $product (release)…"
            swift build -c release --disable-default-traits --product "$product"
            cp "$bindir/$product" stage/
          done
          ls -la stage

      # A downloaded binary carries the quarantine flag, and Gatekeeper runs a
      # quarantined binary only if it is signed with a Developer ID and notarized
      # by Apple; an ad-hoc signature is refused. So with the five secrets below set,
      # each binary is signed with the hardened runtime (notarization requires it)
      # and all of them go to Apple in one submission. With none set it falls back
      # to ad-hoc, and the release notes tell the player to clear the flag by hand.
      # A bare Mach-O cannot have its ticket stapled, so Gatekeeper fetches it
      # online the first time the game runs.
      #
      #   MACOS_CERTIFICATE_P12       the Developer ID Application certificate and
      #                               its private key, exported as .p12, base64
      #   MACOS_CERTIFICATE_PASSWORD  the password the .p12 was exported with
      #   NOTARY_API_KEY              an App Store Connect API key, the .p8 text
      #   NOTARY_API_KEY_ID           that key's ID
      #   NOTARY_API_ISSUER_ID        the issuer ID shown above the key list
      - name: Sign and notarize
        id: sign
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          names=(MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID)
          set_count=0
          for name in "${names[@]}"; do
            if [[ -n "${!name}" ]]; then set_count=$((set_count + 1)); fi
          done
          # The arm64 linker has already signed each binary ad-hoc.
          if [[ $set_count -eq 0 ]]; then
            echo "No signing secrets set; shipping ad-hoc. Downloads will be quarantined."
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Some but not all is a half-finished setup, and publishing ad-hoc
          # binaries under it would hide that until a player hit Gatekeeper.
          if [[ $set_count -ne ${#names[@]} ]]; then
            echo "error: $set_count of the ${#names[@]} signing secrets are set; set all or none." >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this codesign stops at a keychain access prompt nobody answers.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # codesign looks for the identity only in keychains on the search list,
          # even when --keychain names one; without this it reports "no identity
          # found" for the hash find-identity just printed. xargs strips the
          # quotes and indent `list-keychains` prints around each path.
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "error: MACOS_CERTIFICATE_P12 holds no Developer ID Application identity." >&2
            exit 1
          fi

          for bin in stage/*; do
            codesign --force --options runtime --timestamp --keychain "$keychain" -s "$identity" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done

          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          notary_auth=(--key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID")
          ditto -c -k --keepParent stage "$RUNNER_TEMP/notarize.zip"
          # A rejected submission can exit non-zero, and the log below is the only
          # place that says why, so the exit status is left to the status field.
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary_auth[@]}" \
            --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw "$RUNNER_TEMP/notary.json")"
          if [[ "$status" != "Accepted" ]]; then
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" "${notary_auth[@]}" || true
            echo "error: notarization finished with status '$status'." >&2
            exit 1
          fi
          echo "signing=notarized" >> "$GITHUB_OUTPUT"

      # tar so the exec bit survives the download.
      - name: Package release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          arch="$(uname -m)"
          for bin in stage/*; do
            product="$(basename "$bin")"
            tar czf "dist/${product}-macos-${arch}.tar.gz" -C stage "$product"
          done
          ls -la dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist/*.tar.gz
          if-no-files-found: error
          # Artifacts outlive a run attempt, so without this "Re-run all jobs" on a
          # release dies on 409 Conflict before it builds anything.
          overwrite: true

  build-linux:
    # x86_64 on purpose. The test workflow runs on ARM, but the asset names here
    # come from `uname -m`, and the published Linux binaries have always been
    # x86_64 — moving this runner would silently change what people download.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Same toolchain image and version as the test workflow — keep the two in
    # step. Nothing here needs the prebuilt-swift-syntax caveat that workflow
    # documents: no test targets are built, so the macro test target that
    # trips swiftlang/swift-package-manager#10218 is never in the graph.
    container: swift:6.3.3-noble

    # A container job runs steps under `sh`, and on Ubuntu that is dash, which
    # rejects `set -o pipefail` outright — the build step below died in zero
    # seconds the first time. Ask for bash explicitly.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Builds only. `git config --global --add safe.directory` below needs no auth.
          persist-credentials: false

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and package release binaries
        run: |
          set -euo pipefail
          swift --version
          mkdir -p dist
          arch="$(uname -m)"
          # Ships without the `Playtest` trait, exactly as bin/export-game does.
          bindir="$(swift build -c release --disable-default-traits --show-bin-path)"
          for product in $(swift package describe | awk '$1=="Name:"{n=$2} $1=="Executable:"{print n}'); do
            case " $EXCLUDE_PRODUCTS " in *" $product "*) echo "Skipping $product (excluded)"; continue ;; esac
            echo "Building $product (release)…"
            swift build -c release --disable-default-traits --product "$product"
            tar czf "dist/${product}-linux-${arch}.tar.gz" -C "$bindir" "$product"
          done
          ls -la dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          # See the macOS upload: without this a re-run cannot replace its artifacts.
          overwrite: true

  release:
    needs: [build-macos, build-linux]
    # workflow_dispatch runs still build both platforms as a smoke test; only a
    # real tag push publishes a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The only job that writes. Creating a release and uploading its assets need
    # exactly this and nothing more.
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job deliberately has no checkout — it only moves artifacts. But `gh`
          # finds its repo from --repo, then GH_REPO, then a git remote, and never
          # from GITHUB_REPOSITORY. Without this line every command below dies with
          # "fatal: not a git repository" after the assets have already been built,
          # which is how tags 0.1.0 through 0.3.0 all published zero binaries.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          MACOS_SIGNING: ${{ needs.build-macos.outputs.signing }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          assets=(artifacts/**/*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "error: no release assets were produced" >&2
            exit 1
          fi
          echo "Assets: ${assets[*]}"

          # Written one line per paragraph: GitHub renders a newline inside a
          # release body as a line break.
          cat > release-notes.md <<'EOF'
          These binaries exist to exercise Gnusto's release workflow. They are example games from the package's demo products, not featured products.

          Each asset is a `.tar.gz` holding a single executable for the named platform. On macOS 15+ the binary links the Swift runtime that ships with the OS, so it runs directly — no Xcode, no toolchain.
          EOF
          if [[ "$MACOS_SIGNING" == "notarized" ]]; then
            cat >> release-notes.md <<'EOF'

          macOS binaries are signed with a Developer ID and notarized by Apple. The first run checks the notarization with Apple, so it needs an internet connection.
          EOF
          else
            cat >> release-notes.md <<'EOF'

          macOS binaries are ad-hoc signed and not notarized, so macOS refuses to open a downloaded copy until you clear the quarantine flag:

              xattr -dr com.apple.quarantine ./<Game>
          EOF
          fi

          # A version suffix (e.g. 1.2.0-beta) marks a pre-release.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${prerelease[@]}"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
