name: Release

# Publish your game's binaries for macOS and Linux whenever you push a version
# tag. It discovers your executable products from the manifest the same way
# `bin/export-game` does, so it publishes whatever your package ships with no
# edits — tag `1.0.0` and a GitHub release appears with runnable binaries.
#
# To exclude a product from releases, add its name to EXCLUDE_PRODUCTS below.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXCLUDE_PRODUCTS: ""

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # On macOS 15+ the binary links the OS Swift runtime, so the single file is
      # the game. Ad-hoc sign it and tar it so the exec bit survives the download.
      - name: Build and package release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          arch="$(uname -m)"
          bindir="$(swift build -c release --show-bin-path)"
          for product in $(swift package describe | awk '$1=="Name:"{n=$2} $1=="Executable:"{print n}'); do
            case " $EXCLUDE_PRODUCTS " in *" $product "*) echo "Skipping $product (excluded)"; continue ;; esac
            echo "Building $product (release)…"
            swift build -c release --product "$product"
            codesign -s - "$bindir/$product"
            tar czf "dist/${product}-macos-${arch}.tar.gz" -C "$bindir" "$product"
          done
          ls -la dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    # Ubuntu runners ship no Swift, so the toolchain arrives as an image rather
    # than an install step — no scripted download, and a pinned compiler, which
    # matters because a game's macro plugins are compiler-coupled.
    #
    # The pin trails latest stable deliberately. SwiftPM downloads a prebuilt
    # swift-syntax for macros instead of compiling it, which saves minutes per
    # build, but the Linux prebuilts are published per exact toolchain and not
    # every release has one. Before bumping, check that yours does:
    #
    #   curl -sfI https://download.swift.org/prebuilts/swift-syntax/603.0.2/swift-6.3.3-RELEASE-ubuntu_noble_x86_64.json
    #
    # substituting the swift-syntax version your package resolves to and the
    # toolchain you want. 200 means the bump is free; 404 means you pay for it.
    container: swift:6.3.2-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The container runs as root over a checkout git considers foreign;
      # without this, git refuses it as "dubious ownership".
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and package release binaries
        run: |
          set -euo pipefail
          swift --version
          mkdir -p dist
          arch="$(uname -m)"
          bindir="$(swift build -c release --show-bin-path)"
          for product in $(swift package describe | awk '$1=="Name:"{n=$2} $1=="Executable:"{print n}'); do
            case " $EXCLUDE_PRODUCTS " in *" $product "*) echo "Skipping $product (excluded)"; continue ;; esac
            echo "Building $product (release)…"
            swift build -c release --product "$product"
            tar czf "dist/${product}-linux-${arch}.tar.gz" -C "$bindir" "$product"
          done
          ls -la dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux]
    # workflow_dispatch runs still build both platforms as a smoke test; only a
    # real tag push publishes a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          assets=(artifacts/**/*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "error: no release assets were produced" >&2
            exit 1
          fi
          echo "Assets: ${assets[*]}"

          cat > release-notes.md <<'EOF'
          Standalone builds of this game for macOS and Linux.

          Each asset is a `.tar.gz` holding a single executable for the named
          platform. On macOS 15+ the binary links the Swift runtime that ships
          with the OS, so it runs directly — no Xcode, no toolchain.

          macOS binaries are ad-hoc signed; a downloaded copy is quarantined by
          Gatekeeper until you clear it:

              xattr -dr com.apple.quarantine ./<Game>
          EOF

          # A version suffix (e.g. 1.2.0-beta) marks a pre-release.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${prerelease[@]}"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
